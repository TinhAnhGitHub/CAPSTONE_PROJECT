llm_provider:
  api_key: ${OPENROUTER_API_KEY}
  
  model_to_provider:
    z-ai/glm-5.1:
      order:
        - friendli
        - fireworks
        - baidu/fp8
        - gmicloud/fp8
        - deepinfra/fp4
        - streamlake
      allow_fallbacks: true
      require_parameters: true

    deepseek/deepseek-v4-pro:
      order:
        - streamlake
        - alibaba
        - fireworks
      allow_fallbacks: true
      require_parameters: true

    deepseek/deepseek-v4-flash:
      order:
        - deepseek
        - siliconflow/fp8
        - cloudflare
      allow_fallbacks: true
      require_parameters: true
  
  agents:
    greeter:
      model_id: qwen/qwen3.6-plus
      temperature: 0.7
      top_p: 0.95
      max_output_tokens: 2048
      max_tool_calls: 25
    orchestrator:
      model_id: z-ai/glm-5.1
      temperature: 0.5
      top_p: 0.9
      max_output_tokens: 4096
      max_tool_calls: 20
    planning:
      model_id: qwen/qwen3.6-plus
      temperature: 0.4
      top_p: 0.85
      max_output_tokens: 2048
      max_tool_calls: 15
    llm_tool:
      model_id: qwen/qwen3.5-35b-a3b
      temperature: 0.3
      top_p: 0.8
      max_output_tokens: 1024
      max_tool_calls: 10
      extra_body:
        top_k: 40
        repeat_penalty: 1.05
    summarizer:
      model_id: qwen/qwen3.5-35b-a3b
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 2048
      max_tool_calls: 10

  workers:
    - name: qwen/qwen3.6-plus
      model_id: qwen/qwen3.6-plus
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "Qwen 3.6 Plus builds on a hybrid architecture combining efficient linear attention with sparse mixture-of-experts routing, enabling strong scalability and high-performance inference with 1M context length."
      strengths:
        - complex reasoning
        - multi-step planning
        - long-context understanding
        - scalability
        - high-performance inference

    - name: google/gemma-4-31b-it
      model_id: google/gemma-4-31b-it
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "Gemma 4 31B Instruct is Google DeepMind's 30.7B dense multimodal model supporting text and image input with 256K context window, configurable thinking/reasoning mode, and native function calling."
      strengths:
        - multimodal understanding
        - reasoning mode
        - function calling
        - vision tasks
        - instruction following

    - name: xiaomi/mimo-v2-pro
      model_id: xiaomi/mimo-v2-pro
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "MiMo-V2-Pro is Xiaomi's flagship foundation model with 1T+ parameters and 1M context length, deeply optimized for agentic scenarios and multi-step tool execution."
      strengths:
        - large-scale modeling
        - multi-step planning
        - complex agentic workflows
        - long-context reasoning
        - tool integration

    - name: qwen/qwen3.5-plus-02-15
      model_id: qwen/qwen3.5-plus-02-15
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "Qwen3.5 Plus vision-language model with hybrid linear attention + sparse MoE architecture, delivering high inference efficiency with 1M context for diverse multimodal tasks."
      strengths:
        - cost efficiency
        - tool use
        - multimodal tasks
        - efficient inference
        - large context window

    - name: google/gemini-3.1-flash-lite-preview
      model_id: google/gemini-3.1-flash-lite-preview
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "Gemini 3.1 Flash Lite Preview is Google's high-efficiency model for high-volume use cases, approaching Gemini 2.5 Flash performance at lower cost with 1M context."
      strengths:
        - ultra cost efficiency
        - high throughput
        - fast response
        - tool use
        - search and retrieval
        - simple reasoning

    - name: qwen/qwen3.5-flash-02-23
      model_id: qwen/qwen3.5-flash-02-23
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "Qwen3.5 Flash vision-language model with hybrid architecture achieving higher inference efficiency. Ideal for real-time applications and cost-sensitive workloads with 1M context."
      strengths:
        - ultra cost efficiency
        - fast inference
        - tool use
        - search and retrieval
        - agent workflows
        - high throughput

    - name: minimax/minimax-m2.5
      model_id: minimax/minimax-m2.5
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "MiniMax-M2.5 is a SOTA model designed for real-world productivity and coding expertise, trained in diverse complex digital working environments."
      strengths:
        - cost efficiency
        - coding tasks
        - real-world productivity
        - task automation
        - agent workflows

    - name: qwen/qwen3-coder-next
      model_id: qwen/qwen3-coder-next
      temperature: 0.2
      top_p: 0.8
      max_output_tokens: 8192
      max_tool_calls: 20
      extra_body:
        top_k: 40
        repeat_penalty: 1.05
      description: "Qwen3-Coder-Next is optimized for coding agents with sparse MoE design (80B total, 3B active per token), perfect for autonomous programming and tool calling workflows."
      strengths:
        - coding tasks
        - autonomous programming
        - tool calling
        - repository understanding
        - code generation

storage:
  postgres:
    host: postgres
    port: 5432
    database: video-pipeline
    username: admin123
    password: admin123
    url: null
  minio:
    host: minio
    port: '9000'
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    buckets:
      videos: videos
      artifacts: video-artifacts
      asr: asr-data
  qdrant:
    host: qdrant
    port: 6333
    grpc_port: 6334
    prefer_grpc: true
    collection_name: video_embeddings_dev
  elasticsearch:
    host: elasticsearch
    port: 9200
    user: null
    password: null
    use_ssl: false
    verify_certs: true
    request_timeout: 30
    index_name: video_ocr_docs_dev
  arangodb:
    host: http://arangodb:8529
    database: video_kg
    username: root
    password: ''
    graph_name: video_knowledge_graph
    view_name: video_kg_search_view
    collections:
      entities: entities
      events: events
      micro_events: micro_events
      relations: relations
    indexes:
      semantic_dim: 768

inference:
  qwenvl:
    base_url: http://qwen_vl_embedding:8080/embedding
  mmbert:
    base_url: http://mmbert:8000
    model_name: mmbert
  splade:
    url: triton-server:8001
    model_name: splade
    timeout: 30
    verbose: false
    max_batch_size: 32
cache:
  enabled: true
  ttl: 1800
  dir: null
server:
  host: 0.0.0.0
  port: 8080
  debug: false
  cors_origins:
  - http://localhost:3000
  - http://localhost:5173
mlflow:
  enabled: false
  tracking_uri: http://mlflow:5000
  experiment_name: VideoDeepSearch
