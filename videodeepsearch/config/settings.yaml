llm_provider:
  api_key: ${OPENROUTER_API_KEY}
  
  model_to_provider:
    z-ai/glm-5.1:
      order:
        - friendli
        - fireworks
        - baidu/fp8
        - gmicloud/fp8
        - deepinfra/fp4
        - streamlake
      allow_fallbacks: true
      require_parameters: true

    deepseek/deepseek-v4-pro:
      order:
        - streamlake
        - alibaba
        - fireworks
      allow_fallbacks: true
      require_parameters: true

    deepseek/deepseek-v4-flash:
      order:
        - deepseek
        - siliconflow/fp8
        - cloudflare
      allow_fallbacks: true
      require_parameters: true
  
  agents:
    greeter:
      model_id: deepseek/deepseek-v4-flash
      temperature: 0.7
      top_p: 0.95
      max_output_tokens: 2048
      max_tool_calls: 25
    orchestrator:
      model_id: z-ai/glm-5.1
      temperature: 0.5
      top_p: 0.9
      max_output_tokens: 4096
      max_tool_calls: 20
    planning:
      model_id: deepseek/deepseek-v4-flash
      temperature: 0.4
      top_p: 0.85
      max_output_tokens: 2048
      max_tool_calls: 15
    llm_tool:
      model_id: deepseek/deepseek-v4-flash
      temperature: 0.3
      top_p: 0.8
      max_output_tokens: 1024
      max_tool_calls: 10
      extra_body:
        top_k: 40
        repeat_penalty: 1.05
    summarizer:
      model_id: deepseek/deepseek-v4-flash
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 2048
      max_tool_calls: 10

  workers:
    - name: deepseek/deepseek-v4-flash
      model_id: deepseek/deepseek-v4-flash
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "DeepSeek V4 Flash is an efficiency-optimized Mixture-of-Experts model with 284B total parameters, 13B activated parameters, and a 1M-token context window. It is optimized for fast inference, high-throughput workloads, coding, reasoning, and responsive agent workflows."
      strengths:
        - fast inference
        - high throughput
        - cost efficiency
        - coding
        - reasoning
        - long-context processing
        - agent workflows

    - name: xiaomi/mimo-v2.5
      model_id: xiaomi/mimo-v2.5
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "MiMo-V2.5 is Xiaomi's native omnimodal model with a 1M-token context window. It is designed for strong agentic performance, multimodal perception, image and video understanding, long-context reasoning, and cost-efficient agent framework integration."
      strengths:
        - multimodal perception
        - image understanding
        - video understanding
        - agentic reasoning
        - long-context reasoning
        - cost efficiency
        - document understanding

    - name: deepseek/deepseek-v4-pro
      model_id: deepseek/deepseek-v4-pro
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "DeepSeek V4 Pro is a large-scale Mixture-of-Experts model with 1.6T total parameters, 49B activated parameters, and a 1M-token context window. It is designed for advanced reasoning, coding, math, software engineering, full-codebase analysis, multi-step automation, and large-scale synthesis."
      strengths:
        - advanced reasoning
        - coding
        - math
        - software engineering
        - full-codebase analysis
        - multi-step automation
        - large-scale synthesis
        - long-horizon agent workflows

    - name: minimax/minimax-m3
      model_id: minimax/minimax-m3
      temperature: 0.3
      top_p: 0.85
      max_output_tokens: 8192
      max_tool_calls: 20
      description: "MiniMax M3 is a multimodal foundation model supporting text, image, and video inputs with text output. It has a 1M-token context window and is suited for long-horizon agentic work, coding, tool use, and sustained multi-step collaboration."
      strengths:
        - multimodal input
        - image understanding
        - video understanding
        - long-horizon agentic work
        - coding
        - tool use
        - multi-step collaboration
        - long-context processing

    
storage:
  postgres:
    host: postgres
    port: 5432
    database: video-pipeline
    username: admin123
    password: admin123
    url: null
  minio:
    host: minio
    port: '9000'
    access_key: minioadmin
    secret_key: minioadmin
    secure: false
    buckets:
      videos: videos
      artifacts: video-artifacts
      asr: asr-data
  qdrant:
    host: qdrant
    port: 6333
    grpc_port: 6334
    prefer_grpc: true
    collection_name: video_embeddings_dev
  elasticsearch:
    host: elasticsearch
    port: 9200
    user: null
    password: null
    use_ssl: false
    verify_certs: true
    request_timeout: 30
    index_name: video_ocr_docs_dev
  arangodb:
    host: http://arangodb:8529
    database: video_kg
    username: root
    password: ''
    graph_name: video_knowledge_graph
    view_name: video_kg_search_view
    collections:
      entities: entities
      events: events
      micro_events: micro_events
      relations: relations
    indexes:
      semantic_dim: 768

inference:
  qwenvl:
    base_url: http://qwen_vl_embedding:8080/embedding
  mmbert:
    base_url: http://mmbert:8000
    model_name: mmbert
  splade:
    url: triton-server:8001
    model_name: splade
    timeout: 30
    verbose: false
    max_batch_size: 32
cache:
  enabled: true
  ttl: 1800
  dir: null
server:
  host: 0.0.0.0
  port: 8080
  debug: false
  cors_origins:
  - http://localhost:3000
  - http://localhost:5173
mlflow:
  enabled: false
  tracking_uri: http://mlflow:5000
  experiment_name: VideoDeepSearch
